<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SSP profit calculator</title>
    <link href="style.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/pigfish.png">
</head>

<body>
    <section class="container">
        <h2>PigFish's SSP calculator <a href="https://youtu.be/yXHZ-oC-2cE" class="tutorialLink"
                target="_blank">Tutorial</a></h2>
        <h4 id="noPrice">No price set: </h4>

        <div class="sspPriceDiv">
            <label for="sspCost">Buy SSP Price (per 200): </label>
            <input type="number" id="sspCost" value="15" placeholder="15">
            <img src="images/worldlock.png" alt="WL">
        </div>

        <div class="resultDiv">
            <div class="topDiv">
                <img src="images/ssp.png">
                <a id="sspAmount">= 0</a>
            </div>
            <button id="calculateBtn">Calculate</button>
            <div class="topDiv">
                <img src="images/worldlock.png">
                <a id="wlAmount">= 0</a>
            </div>
        </div>
        
        <div class="profitDiv">
            <div class="topDiv profitBox">
                <span>Clean Profit: </span>
                <img src="images/worldlock.png" style="margin-left: 15px;">
                <a id="profitAmount">= 0</a>
            </div>
        </div>

        <!-- Seeds will be dynamically populated here by face.js -->
        <section class="seeds" id="seedsContainer">
        </section>

    </section>
    <script src="http://ajax.microsoft.com/ajax/jquery/jquery-3.4.1.min.js"></script>
    <script src="face.js"></script>
</body>

</html>
